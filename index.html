<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="description" content="Malak Zenbaa — Business Analyst and Data Analytics portfolio" />
  <title>Malak Zenbaa — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20260925-13" />
</head>
<body>
  <div class="ambient-bg" aria-hidden="true"></div>

  <main class="site-shell">
    <aside class="profile-card" id="profileCard">
      <div class="profile-photo-wrap">
        <img id="profileImage" class="profile-photo" src="assets/profile/profile.jpeg" alt="Malak Zenbaa" />
        <div id="profileFallback" class="profile-fallback" aria-hidden="true">MZ</div>
      </div>
      <h1 id="profileName">Malak Zenbaa</h1>
      <div class="role-tags" id="roleTags"></div>
      <div class="profile-divider"></div>
      <div class="contact-list" id="contactList"></div>
      <div class="social-row" id="socialRow"></div>
    </aside>

    <section class="workspace">
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="portfolioNav">
        <span class="nav-toggle-icon" aria-hidden="true"><span></span><span></span><span></span></span>
        <span>Menu</span>
      </button>
      <nav class="top-nav" id="portfolioNav" aria-label="Portfolio navigation">
        <button class="nav-item active" data-route="about">About</button>
        <button class="nav-item" data-route="projects">Projects</button>
        <button class="nav-item" data-route="resume">Resume</button>
        <button class="nav-item" data-route="certificates">Certificates</button>
        
        <!-- <button class="nav-item" data-route="awards">Awards</button> -->
        <button class="nav-item" data-route="contact">Contact</button>
      </nav>

      <section class="page-panel" id="pagePanel" aria-live="polite"></section>
    </section>
  </main>

  <div class="project-modal" id="projectModal" aria-hidden="true">
    <div class="project-modal-backdrop" data-close-modal></div>
    <article class="project-modal-card" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle">
      <button class="modal-close" data-close-modal aria-label="Close project dialog">×</button>
      <div id="projectModalContent"></div>
    </article>
  </div>

  <div class="success-modal" id="successModal" aria-hidden="true">
    <div class="success-modal-backdrop" data-close-success-modal></div>
    <article class="success-modal-card" role="dialog" aria-modal="true" aria-labelledby="successModalTitle" aria-describedby="successModalMessage">
      <button class="modal-close" type="button" data-close-success-modal aria-label="Close success message">×</button>
      <div class="success-modal-icon" aria-hidden="true">✓</div>
      <h2 id="successModalTitle">Message sent!</h2>
      <p id="successModalMessage">Thank you for getting in touch. </p>
      <button class="success-modal-action" type="button" data-close-success-modal>Done</button>
    </article>
  </div>

  <div class="image-lightbox" id="imageLightbox" aria-hidden="true">
    <div class="image-lightbox-backdrop" data-close-lightbox></div>
    <div class="image-lightbox-dialog" role="dialog" aria-modal="true" aria-label="Full-size image">
      <button class="lightbox-close" type="button" data-close-lightbox aria-label="Close full-size image">×</button>
      <img id="lightboxImage" alt="" />
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script>
  <script src="js/app.js?v=20260925-12" defer></script>
</body>
</html>
